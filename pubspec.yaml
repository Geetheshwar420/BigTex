name: bigtex
description: A minimal single-file Flutter app demonstrating pinch-to-zoom text.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.17.0 <4.0.0'
  flutter: '>=2.10.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.0
  path_provider: ^2.1.6
  share_plus: ^13.2.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.11.0

flutter:
  uses-material-design: true

flutter_icons:
  android: true
  ios: true
  image_path: "BigTex Icon.jpg"
